name: build-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod gcc-9-aarch64-linux-gnu

      - name: Config
        run: |
          make ARCH=arm64 CC=aarch64-linux-gnu-gcc-9 kirin710_defconfig
          ./scripts/config -e KVM
          grep -E "CONFIG_KVM|CONFIG_VIRTUALIZATION|CONFIG_ARM64_VHE" .config || true

      - name: Build
        run: make ARCH=arm64 CC=aarch64-linux-gnu-gcc-9 -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          if-no-files-found: error
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image
            arch/arm64/boot/dtb
